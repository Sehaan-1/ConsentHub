# Declarative record of the protection applied to main. GitHub branch rules are
# repository settings, so this file documents the settings and required CI names
# alongside the workflow that supplies them.
branch: main
required_pull_request_reviews:
  required_approving_review_count: 1
  dismiss_stale_reviews: true
required_status_checks:
  strict: true
  contexts:
    - Validate OpenAPI contract
    - Frontend (apps/customer-portal)
    - Frontend (apps/ops-console)
    - Frontend (apps/bff)
    - Frontend (apps/partner-sandbox)
    - Shared UI
    - Backend (Maven)
allow_force_pushes: false
allow_deletions: false
