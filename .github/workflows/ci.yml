name: CI

# One pipeline at the repo root that fans out across the JS workspaces and the
# Maven multi-module backend. Contract-first: the contract is generated for both
# halves in the same job graph, so an incompatible spec change fails the PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @consenthub/contract lint

  frontend:
    name: Frontend (${{ matrix.package }})
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - apps/web
          - apps/portal
          - services/bff
          - sandbox/partner-mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # BFF regenerates typed clients from the contract before building.
      - if: ${{ matrix.package == 'services/bff' }}
        run: pnpm --filter @consenthub/bff contract:generate
      - run: pnpm --filter "./${{ matrix.package }}" lint
      - run: pnpm --filter "./${{ matrix.package }}" build
      - run: pnpm --filter "./${{ matrix.package }}" test

  backend:
    name: Backend (Maven)
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # openapi-generator regenerates server stubs from the same contract file;
      # a breaking spec change fails `verify` here, in the same PR.
      - run: mvn -q -f backend verify
