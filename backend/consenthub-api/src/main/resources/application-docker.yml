# Docker profile: runs inside the compose stack. Hostnames `mysql` and
# `redis` are the compose service names. Credentials come from the container
# environment (injected by docker-compose.yml from the local `.env`); they
# never live in this file or in docker-compose.yml.
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:consenthub}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${MYSQL_USER:consenthub}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
  data:
    redis:
      url: redis://:${REDIS_PASSWORD:}@${REDIS_HOST:redis}:${REDIS_PORT:6379}

management:
  endpoint:
    health:
      # A reviewer can curl /actuator/health and see which dependency is up.
      show-details: always
  health:
    redis:
      enabled: true
